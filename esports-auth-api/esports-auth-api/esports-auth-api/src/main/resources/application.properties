
spring.application.name=esports-auth-api
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/esports_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


esports.api.url=http://localhost:8081


logging.level.cl.duocuc.esports_auth_api=INFO

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true